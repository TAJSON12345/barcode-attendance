version: "3.9"

services:

  web:
    build: .
    container_name: barcode-web

    ports:
      - "8000:80"

    volumes:
      - ./app:/var/www/html

    depends_on:
      - postgres

  postgres:

    image: postgres:16

    container_name: barcode-db

    restart: always

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: admin123

      POSTGRES_DB: attendance_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:

    image: dpage/pgadmin4

    container_name: barcode-pgadmin

    restart: always

    environment:

      PGADMIN_DEFAULT_EMAIL: admin@admin.com

      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

volumes:

  postgres_data: